pipeline:
  name: devppl
  identifier: devppl
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: devenv
        repoName: Makeen_Project
        build: <+input>
  stages:
    - stage:
        name: devbuilld
        identifier: devbuilld
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: S3Upload
                  name: S3Upload_1
                  identifier: S3Upload_1
                  spec:
                    connectorRef: awsdev
                    region: us-east-1
                    bucket: " harnessartifacts"
                    sourcePath: /artifacts
                    endpoint: s3://arn:aws:s3:us-east-1:891377120087:accesspoint/devaccess
              - step:
                  type: BuildAndPushECR
                  name: BuildAndPushECR_1
                  identifier: BuildAndPushECR_1
                  spec:
                    connectorRef: awsdev
                    region: us-east-1
                    account: "891377120087"
                    imageName: harnessimage
                    tags:
                      - dev
              - step:
                  type: Semgrep
                  name: Semgrep_1
                  identifier: Semgrep_1
                  spec:
                    target:
                      detection: auto
                      type: repository
                    advanced:
                      log:
                        level: info
                      args: {}
                    mode: orchestration
                    config: default
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: devcluster
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
        when:
          pipelineStatus: Success
    - stage:
        name: devdeploy
        identifier: devdeploy
        description: ""
        type: Deployment
        spec:
          deploymentType: NativeHelm
          execution:
            steps:
              - step:
                  type: HelmDeploy
                  name: HelmDeploy_1
                  identifier: HelmDeploy_1
                  spec:
                    skipDryRun: false
                    ignoreReleaseHistFailStatus: false
                  timeout: 10m
            rollbackSteps: []
          service:
            serviceRef: devsvc
          environment:
            environmentRef: dev
            deployToAll: false
            infrastructureDefinitions:
              - identifier: devinfra
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
